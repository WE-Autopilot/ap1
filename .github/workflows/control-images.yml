# Builds the control image (CPU only), smoke-tests it, and on main pushes it to
# ghcr.io/we-autopilot/ap1/control. See docker/README.md.
name: Control images

on:
  pull_request:
    paths:
      - "docker/**"
      - "src/control/**"
      - ".dockerignore"
      - "src/msgs/**"
      - ".github/workflows/control-images.yml"
  # Builds on development too, without pushing images: PRs can only read the
  # build cache of their own branch and their base branch, so this gives every
  # new PR into development a warm cache.
  push:
    branches: [main, development]
    paths:
      - "docker/**"
      - "src/control/**"
      - ".dockerignore"
      - "src/msgs/**"
      - ".github/workflows/control-images.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/we-autopilot/ap1/control
  PUSH: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}

jobs:
  build:
    name: control (cpu)
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/bake-action@v7
        env:
          GIT_SHA: ${{ github.sha }}
        with:
          source: .
          files: docker/docker-bake.hcl
          targets: control
          load: true

      # Runs control_node with the config installed in the image, as the deploy
      # service does. timeout exits with 124 when the node is still running
      # after 10 s; anything else means it crashed or exited.
      - name: Smoke test
        run: |
          docker run --rm "$IMAGE:cpu" bash -c '
            timeout 10 ros2 run ap1_control control_node \
              /opt/ap1/share/ap1_control/config/control_node_cfg.csv
            test $? -eq 124'

      - name: Log in to GHCR
        if: env.PUSH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push
        if: env.PUSH == 'true'
        run: docker push --all-tags "$IMAGE"
