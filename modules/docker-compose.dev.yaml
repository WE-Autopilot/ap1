# Dev containers: each extends its module's service, swaps in the dev image,
# mounts the module's source and idles so you can shell in and build.
# Dev images have no prebuilt workspace: everything in /ws/src is built in the
# container with colcon, including ap1_msgs.

services:
  #################### PERCEPTION ####################
  perception-dev-cpu:
    extends:
      file: docker-compose.yaml
      service: perception-cpu
    profiles: [perception-dev-cpu]
    image: ${AP1_REGISTRY:-ghcr.io/we-autopilot/ap1}/perception:cpu-dev
    # Only deploy services come back after a crash or reboot
    restart: "no"
    volumes:
      - ../src/msgs:/ws/src/msgs
      - ../src/perception:/ws/src/perception
      # Hide the native-setup pyproject.toml: its [project] table breaks
      # colcon builds (see docker/perception.Dockerfile)
      - ../docker/config/pyproject-mask.toml:/ws/src/perception/pyproject.toml:ro
      # Named volumes keep incremental colcon builds across container restarts
      - perception-build-cpu:/ws/build
      - perception-install-cpu:/ws/install
      - perception-log-cpu:/ws/log
    command: sleep infinity

  perception-dev-gpu:
    extends:
      file: docker-compose.yaml
      service: perception-gpu
    profiles: [perception-dev-gpu]
    image: ${AP1_REGISTRY:-ghcr.io/we-autopilot/ap1}/perception:gpu-dev
    restart: "no"
    volumes:
      - ../src/msgs:/ws/src/msgs
      - ../src/perception:/ws/src/perception
      - ../docker/config/pyproject-mask.toml:/ws/src/perception/pyproject.toml:ro
      - perception-build-gpu:/ws/build
      - perception-install-gpu:/ws/install
      - perception-log-gpu:/ws/log
    command: sleep infinity

  #################### CONTROL ####################
  control-dev:
    extends:
      file: docker-compose.yaml
      service: control
    profiles: [control-dev]
    image: ${AP1_REGISTRY:-ghcr.io/we-autopilot/ap1}/control:cpu-dev
    restart: "no"
    volumes:
      - ../src/msgs:/ws/src/msgs
      - ../src/control:/ws/src/control
      - control-build:/ws/build
      - control-install:/ws/install
      - control-log:/ws/log
    command: sleep infinity

# One set per variant: a build tree compiled against the CPU image must not be
# reused in the GPU one, and the other way round
volumes:
  perception-build-cpu:
  perception-install-cpu:
  perception-log-cpu:
  perception-build-gpu:
  perception-install-gpu:
  perception-log-gpu:
  control-build:
  control-install:
  control-log:
