# AP1 module services: how each module runs on the car and in integration tests.
# Service names match the targets in docker/docker-bake.hcl (e.g. perception-cpu,
# perception-gpu). Each user creates a root .env file that sets COMPOSE_FILE
# (docker/README.md, Setup), so you can run from the repo root without -f flags:
#   docker compose up -d perception-cpu
# See docker/README.md for the everyday commands.
#
# Settings, read from your shell or .env (defaults in brackets):
#   AP1_REGISTRY    image registry prefix          [ghcr.io/we-autopilot/ap1]
#   AP1_TAG_SUFFIX  appended to the deploy image tag: empty for local builds,
#                   -<git sha> to pin an exact CI-built image  [empty]
#   ROS_AUTOMATIC_DISCOVERY_RANGE                  [LOCALHOST]

name: ap1

# block of settings that all ros services share, notice the <<: *ros in the perception service
# any top level key starting with x- is ignored by compose, so this is only settings not a service
x-ros: &ros
  init: true
  # ROS 2 discovery and shared-memory transport between containers and the host (native nodes)
  network_mode: host
  ipc: host
  environment:
    - FASTDDS_BUILTIN_TRANSPORTS=${FASTDDS_BUILTIN_TRANSPORTS:-UDPv4}
    - ROS_DOMAIN_ID
    - RMW_IMPLEMENTATION
    # Keep ROS 2 discovery on this machine unless told otherwise
    # Export ROS_AUTOMATIC_DISCOVERY_RANGE=SUBNET to talk to other machines (car, laptops).
    - ROS_AUTOMATIC_DISCOVERY_RANGE=${ROS_AUTOMATIC_DISCOVERY_RANGE:-LOCALHOST}

services:
  #################### PERCEPTION ####################
  perception-cpu: &perception
    <<: *ros
    profiles: [perception-cpu]
    image: ${AP1_REGISTRY:-ghcr.io/we-autopilot/ap1}/perception:cpu${AP1_TAG_SUFFIX:-}
    restart: unless-stopped
    volumes:
      # The model is in Git LFS, so it's mounted straight from the checkout
      - ../src/perception/ap1_perception/yolo/yolo11n.onnx:/opt/ap1/models/yolo11n.onnx:ro
      - ../bags:/ws/bags
    command: >
      ros2 launch ap1_perception yolo.launch.py
      model_path:=/opt/ap1/models/yolo11n.onnx

  perception-gpu:
    <<: *perception
    profiles: [perception-gpu]
    image: ${AP1_REGISTRY:-ghcr.io/we-autopilot/ap1}/perception:gpu${AP1_TAG_SUFFIX:-}
    gpus: all

  #################### CONTROL ####################
  # only one base control service, no variants as they do not require GPUs
  control: &control
    <<: *ros
    profiles: [control]
    image: ${AP1_REGISTRY:-ghcr.io/we-autopilot/ap1}/control:cpu${AP1_TAG_SUFFIX:-}
    restart: unless-stopped
    # control_node takes the config CSV path as its first argument (not a ROS params file).
    # The CSV is installed into the image by CMake
    command: >
      ros2 run ap1_control control_node
      /opt/ap1/share/ap1_control/config/control_node_cfg.csv

  #################### ALL MODULES ####################
  # Every module from one image (all-deploy in docker-bake.hcl), one container
  # per module, so each restarts and logs on its own while sharing one build of
  # ap1_msgs. GPU only, like the car. Start with `docker compose --profile all-deploy up -d`.
  # Don't run alongside the per-module services above, or every node runs twice.
  # extends merges profiles, so !override keeps these out of the module profiles.
  all-perception:
    extends:
      service: perception-gpu
    profiles: !override [all-deploy]
    image: ${AP1_REGISTRY:-ghcr.io/we-autopilot/ap1}/all:gpu${AP1_TAG_SUFFIX:-}

  all-control:
    extends:
      service: control
    profiles: !override [all-deploy]
    image: ${AP1_REGISTRY:-ghcr.io/we-autopilot/ap1}/all:gpu${AP1_TAG_SUFFIX:-}
