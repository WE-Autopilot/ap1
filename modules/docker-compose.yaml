# AP1 module services: how each module runs on the car and in integration tests.
# Images are built by docker/docker-bake.hcl. Run from the repo root, e.g.
#   docker compose -f modules/docker-compose.yaml up -d perception
# See docker/README.md for the everyday commands.
#
# Settings, read from your shell (defaults in brackets):
#   AP1_REGISTRY    image registry prefix          [ghcr.io/we-autopilot/ap1]
#   AP1_VARIANT     cpu | gpu    image variant     [cpu]
#   AP1_TAG_SUFFIX  appended to the deploy image tag: empty for local builds,
#                   -<git sha> to pin an exact CI-built image  [empty]
#   ROS_AUTOMATIC_DISCOVERY_RANGE                  [LOCALHOST]
#
# Override files, layered on top with extra -f flags:
#   docker-compose.dev.yaml   dev containers (source mounted, built inside)
#   docker-compose.gpu.yaml   GPU access, with AP1_VARIANT=gpu

name: ap1

# block of settings that all ros services share, notice the <<: *ros in the perception service
# any top level key starting with x- is ignored by compose, so this is only settings not a service
x-ros: &ros
  init: true
  # ROS 2 discovery and shared-memory transport between containers and the host (native nodes)
  network_mode: host
  ipc: host
  environment:
    - FASTDDS_BUILTIN_TRANSPORTS=${FASTDDS_BUILTIN_TRANSPORTS:-UDPv4}
    - ROS_DOMAIN_ID
    - RMW_IMPLEMENTATION
    # Keep ROS 2 discovery on this machine unless told otherwise
    # Export ROS_AUTOMATIC_DISCOVERY_RANGE=SUBNET to talk to other machines (car, laptops).
    - ROS_AUTOMATIC_DISCOVERY_RANGE=${ROS_AUTOMATIC_DISCOVERY_RANGE:-LOCALHOST}

services:
  #################### PERCEPTION ####################
  perception:
    <<: *ros
    profiles: [perception]
    image: ${AP1_REGISTRY:-ghcr.io/we-autopilot/ap1}/perception:${AP1_VARIANT:-cpu}${AP1_TAG_SUFFIX:-}
    restart: unless-stopped
    volumes:
      # The model is in Git LFS, so it's mounted straight from the checkout
      - ../src/perception/ap1_perception/yolo/yolo11n.onnx:/opt/ap1/models/yolo11n.onnx:ro
      - ../bags:/ws/bags
    command: >
      ros2 launch ap1_perception yolo.launch.py
      model_path:=/opt/ap1/models/yolo11n.onnx
  # TODO: Add other modules if/when they employ docker e.g. planning, control, mapping, localization
